name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check src tests

      - name: Tests
        run: uv run pytest -q

      - name: Pipeline definition
        run: uv run dvc dag

      - name: App requirements up to date
        run: |
          uv export --only-group app --no-hashes --no-emit-project -o src/property_price/app/requirements.txt
          git diff --exit-code src/property_price/app/requirements.txt
