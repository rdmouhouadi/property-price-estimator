[project]
name = "property-price-estimator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=2.0.1",
    "dvc>=3.67.1",
    "fastapi>=0.165.0",
    "huggingface-hub>=2.4.0",
    "lightgbm>=4.7.0",
    "mlflow>=3.18.0",
    "pandas>=3.1.1",
    "plotly>=7.1.0",
    "polars>=2.1.0",
    "pyarrow>=26.0.1",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "streamlit>=1.67.0",
    "tqdm>=4.70.1",
    "uvicorn>=0.54.0",
    "xgboost>=3.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/property_price"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]   # ruff defaults + import sorting
