data:
  dvf_years: [2021, 2022, 2023, 2024, 2025]

dpe:
  min_date: "2021-07-01"        # new DPE method starts

match:                          # ADR-0004
  surf_tol: 0.10
  days_before: 365
  days_after: 30
  min_ban_score: 0.5

features:
  k_shrink: 20                  # pseudo-count for shrinkage
  window_days: 365              # market lookback

split:
  valid_start: "2024-07-01"
  test_start: "2025-01-01"

model:
  feature_set: dpe
  seed: 42
  learning_rate: 0.05
  num_leaves: 255
  min_child_samples: 50
  subsample: 0.8
  subsample_freq: 1
  colsample_bytree: 0.8
  max_trees: 3000
  early_stopping_rounds: 100

dpe_rules:                      # ADR-0005 (used by the harmonise step later)
  elec_coefficient: 1.9
  electric_energy_ids: [1, 12]      # ← replace with the ids from the drift log
